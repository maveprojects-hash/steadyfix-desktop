name: Build desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - name: List what was built
        shell: bash
        run: ls -la dist
      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
      - name: Make sure the release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "STEADYFIX $GITHUB_REF_NAME" --notes "Desktop app for STEADYFIX CMMS" || true
      - name: Attach the files to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.exe dist/*.dmg dist/*.AppImage dist/latest*.yml dist/*.blockmap; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber
            fi
          done
